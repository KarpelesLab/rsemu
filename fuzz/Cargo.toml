# The fuzz harness is its own crate, deliberately detached from the parent.
#
# `[workspace]` below is not decoration: the parent `Cargo.toml` has no
# `[workspace]` section, so without this line cargo would walk up, find
# `rsemu`, and pull `libfuzzer-sys` into the parent's dependency graph — which
# would break the dependency-policy check (CLAUDE.md: `cargo tree` on the
# default build shows only `rsemu`) for a crate that is not even part of the
# product. Detaching keeps the sanitizer-instrumented, nightly-only, externally
# dependent half of the repo out of every build that is not a fuzz run.
#
# This is the one place in the repo where external dependencies are acceptable,
# for the same reason the sibling crates `compcol` and `purecrypto` allow it:
# nothing here ships.
[workspace]

[package]
name           = "rsemu-fuzz"
version        = "0.0.0"
edition        = "2024"
authors        = ["Karpeles Lab Inc."]
license        = "MIT"
description    = "cargo-fuzz targets for rsemu's parsers (ROADMAP.md §13, phase 2 gate)."
publish        = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

# `std` but not `cli`: the fuzz targets link the library, never the binary, and
# a fuzz target is a `no_main` std program regardless. Structured input is
# hand-decoded from the raw byte stream (see `state_roundtrip`), so no
# `arbitrary` derive dependency is needed — which also keeps the corpus stable
# across `arbitrary` versions, since a derive change silently reinterprets
# every seed.
[dependencies.rsemu]
path             = ".."
default-features = false
features         = ["std", "vnc", "dev-flash-cfi", "dev-usb-ehci", "dev-usb-dwc2", "dev-usb-hid", "dev-blk", "dev-ne2000", "dev-nvme", "ir", "jit", "cpu-riscv-lift", "float"]

# Each `[[bin]]` is a separate fuzz target. Per cargo-fuzz convention they live
# under fuzz_targets/.

# ROADMAP.md §13 phase 2 gate: "the parser fuzz target survives 1 CPU-hour from
# a seeded corpus with zero crashes and zero timeouts".
[[bin]]
name  = "machine_parser"
path  = "fuzz_targets/machine_parser.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "state_decoder"
path  = "fuzz_targets/state_decoder.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "state_roundtrip"
path  = "fuzz_targets/state_roundtrip.rs"
test  = false
doc   = false
bench = false

# The one MMIO surface with an invariant a guest must not be able to break:
# a program can only clear bits (CLAUDE.md, "Testing").
[[bin]]
name  = "flash_cfi"
path  = "fuzz_targets/flash_cfi.rs"
test  = false
doc   = false
bench = false

# The other MMIO surface with an invariant a guest must not be able to break:
# every walk over a linked list the *guest* built has to terminate (CLAUDE.md,
# "Testing", and ROADMAP.md §12). An unbounded walk shows up here as a timeout.
[[bin]]
name  = "usb_ehci"
path  = "fuzz_targets/usb_ehci.rs"
test  = false
doc   = false
bench = false

# The same bus behind a controller with the opposite hazard: a dwc2 reads no
# guest memory at all, so what has to be bounded is not a walk but the FIFOs the
# guest fills a word at a time, and the frame that drains them.
[[bin]]
name  = "usb_dwc2"
path  = "fuzz_targets/usb_dwc2.rs"
test  = false
doc   = false
bench = false

# The IR verifier is a parser too — it reads blocks built by frontends, and a
# frontend turns attacker-controlled guest bytes into IR. Paired with the
# optimiser, because a DCE that removes a store, a charge, a dummy read or the
# temporary a boundary names is a silent miscompile rather than a crash.
# The NIC's 32 I/O ports, and the receive ring a guest programs behind them.
# All four ring pointers are writable and the receive path does page arithmetic
# with them, so what has to hold for an arbitrary configuration is that taking
# in a frame is bounded work -- an unterminating wrap shows up here as a
# timeout. The debug-read rule rides along: a debugger must not pop the remote
# DMA window, clear a tally counter or trip the card's reset strap.
[[bin]]
name  = "ne2000_ports"
path  = "fuzz_targets/ne2000_ports.rs"
test  = false
doc   = false
bench = false

# The third bus master in the tree, and the one whose structures are richest:
# a doorbell write makes the controller fetch a 64-byte command, walk a PRP
# chain whose last entry may point at another chain, move data, and write a
# completion back -- every pointer of it out of guest memory. Its register block
# is also mapped in the space it masters, so the fuzzer can aim a transfer at
# the controller's own doorbells and re-enter the write handler from inside
# itself; a stack overflow here would say the engine was recursive.
[[bin]]
name  = "nvme_mmio"
path  = "fuzz_targets/nvme_mmio.rs"
test  = false
doc   = false
bench = false

[[bin]]
name  = "ir_verify"
path  = "fuzz_targets/ir_verify.rs"
test  = false
doc   = false
bench = false

# The other half of the IR's correctness, and the one verification cannot
# reach: CLAUDE.md ("CPU cores") makes a frontend differentially tested against
# its interpreter forever, so this runs one guest program through both and
# compares registers, PC, ticks, memory and faults. The verifier proves a block
# is well-formed; only this proves it means the same thing.
[[bin]]
name  = "riscv_lift"
path  = "fuzz_targets/riscv_lift.rs"
test  = false
doc   = false
bench = false

# The one file rsemu parses that the *user* did not write: a disk image named on
# the command line, whose header, refcount table and cluster lookup all run
# before a single guest instruction does. CLAUDE.md asks for a fuzz target on
# disk-image parsers by name; this is that surface, plus the bounds check that
# has to hold whatever capacity the header claimed.
[[bin]]
name  = "blk_image"
path  = "fuzz_targets/blk_image.rs"
# Soft float: the host FPU is an oracle only for nearest-even arithmetic with a
# finite result, so this target checks those cases against it and everything
# else -- the other four rounding attributes, the flags, NaN payloads and the
# whole 80-bit path -- against properties that must hold whatever the answer
# is. Reserved x87 encodings go in raw, because "not a value" is a case the
# arithmetic has to survive rather than trust.
[[bin]]
name  = "float_ops"
path  = "fuzz_targets/float_ops.rs"
# A recording is a file a user hands us — `rsemu replay session.trace` on a
# different host, out of a bug report — so `core::record`'s reader is a parser
# on untrusted input like `core::state`'s. Paired with the replay path, because
# a cursor that could fail to advance over attacker-chosen instants is an
# infinite loop inside a run rather than a crash.
[[bin]]
name  = "record_log"
path  = "fuzz_targets/record_log.rs"
test  = false
doc   = false
bench = false

# Block chaining's hard half. Patching an exit to its successor is easy;
# clearing that pointer when the successor is invalidated is where translation
# caches go wrong, because the pointer lives in a block that is not the one
# going away. `jit::cache` keeps back edges for it and `BlockCache::check`
# states the invariant; this drives arbitrary sequences of insert, link,
# invalidate, evict and flush at it and asserts the invariant after every one.
[[bin]]
name  = "jit_cache"
path  = "fuzz_targets/jit_cache.rs"
test  = false
doc   = false
bench = false

# The one parser in the tree that decodes bytes from an unauthenticated stranger
# on a TCP socket: RFB's client messages (RFC 6143 §7.5), two of which carry a
# length the peer chooses and then index the buffer that length came out of.
# The properties are framing exactness and prefix monotonicity -- a parser that
# over-reports its own length desynchronises the stream and starts decoding key
# events out of the middle of a clipboard.
[[bin]]
name  = "vnc_proto"
path  = "fuzz_targets/vnc_proto.rs"
test  = false
doc   = false
bench = false
