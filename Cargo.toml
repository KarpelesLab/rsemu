[package]
name          = "rsemu"
version       = "0.0.2"
edition       = "2024"
# Edition 2024 stabilised in 1.85; 1.88 is the floor we hold to, for let-chains
# and to match the sibling crates (compcol, purecrypto) so the whole family
# shares one MSRV. The project is stable-only (ROADMAP.md §0) — the sole nightly
# is one CI job for threaded wasm32-unknown-unknown, impossible on stable
# (§11.1). CI pins a 1.88 job so the MSRV is a checked claim, not a comment.
rust-version  = "1.88"
authors       = ["Karpeles Lab Inc."]
license       = "MIT"
description   = "A multiplatform emulator in pure Rust, built bottom-up on a generic framework."
repository    = "https://github.com/KarpelesLab/rsemu"
readme        = "README.md"
keywords      = ["emulator", "emulation", "virtualization", "no_std"]
categories    = ["emulators", "no-std", "virtualization"]
exclude       = ["/docs/local", "/.github"]

[dependencies]
# PNG and APNG encoding for `host::display::png`: headless frame capture for CI,
# the docs' screenshots, and the frame-hash regression. First-party (Karpelès
# Lab, MIT) and pure Rust; `default-features = false` drops `oxideav-core`, so
# the whole added tree is this crate plus `compcol` — already permitted
# (CLAUDE.md). Optional, so the default `cargo tree` is still only `rsemu`.
oxideav-png = { version = "0.1", default-features = false, optional = true }

[features]
# The emulation core is always compiled and never feature-gated. Everything
# else is one feature per component, so a NES build links a 6502 and nothing
# else. Component features (cpu-*, dev-*, bus-*, machine-*) are added as those
# components land; the list is deliberately short while there is nothing to gate.
default = ["std", "cli"]

# Pulls in `std`. Without it the crate is `no_std + alloc`, which CI builds on
# every commit — the emulation core must never depend on `std` (ROADMAP.md §0).
std = []

# The `rsemu` binary. Needs `std`.
cli = ["std"]

# The gdbstub (src/host/gdb): the GDB remote serial protocol over TCP —
# registers, memory, breakpoints and write watchpoints, a machine's CPUs as GDB
# threads, and `qXfer:features:read` target descriptions generated from each
# core's register map, which is what lets gdb debug an architecture it was never
# compiled to know about. Hand-rolled TCP and packet parsing on `std::net`; no
# external crates. Needs `std`, and a CPU feature to have anything to debug.
gdb = ["std"]

# Headless capture in `host::display::png`: a scanout surface as a PNG, and a
# sequence of them as an APNG. Adds `oxideav-png` (and, through it, `compcol`)
# — the only dependency any feature of this crate pulls. Needs `std`.
display-png = ["std", "dep:oxideav-png"]

# The browser demo (web/): the wasm exports the page calls, plus the machines it
# offers — an NTSC NES with a picture and sound, and an Apple 1 on a terminal.
# This is the feature set `web/README.md` builds; plain `wasm` stays minimal so
# the CI wasm job keeps checking the boundary rather than the catalog.
demo = ["wasm", "machine-nes", "dev-nes-ppu", "dev-nes-apu", "machine-apple1"]

# NES cartridges (src/dev/cart): iNES and NES 2.0 image parsing, the
# `Cartridge` type, and NROM (iNES mapper 0) as a device that maps PRG ROM,
# CHR ROM/RAM and the nametable mirroring into `core::space`. `no_std + alloc`
# and dependency-free; a `machine-nes` build needs it, nothing else does.
dev-nes-cart = []

# The NES APU (RP2A03 audio): two pulse channels with sweep, triangle, noise,
# the DMC with its CPU-stalling sample fetch, the frame counter and its IRQ, and
# the non-linear mixer. `no_std`, no floats in the time path. Pulls in nothing —
# a NES build enables this plus a 6502 and a PPU.
#
# It also selects this chip's adapter in `host::audio` (`host/audio/nes.rs`),
# which is what turns those samples into something a `.wav` or a browser can
# play. The seam itself is not gated: like `host::display` it always compiles,
# and the WAV writer needs no dependency to gate.
dev-nes-apu = []

# WebAssembly bindings (src/wasm.rs): plain C-ABI exports plus embedder-supplied
# imports, following purecrypto's browser convention. Deliberately no
# wasm-bindgen — the dependency policy forbids it, and the exports are simple
# enough not to need it.
#
# Implies `std`: the wasm shim is part of the host layer (ROADMAP.md §3), and
# wasm targets ship a std with an allocator and a panic handler. The `no_std`
# guarantee is about the emulation core and is checked separately by the
# `--no-default-features` CI job. Build with:
#   cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
#       --no-default-features --features wasm --release
wasm = ["std"]

# The NES console's own I/O (src/dev/nes): the two controller ports at
# $4016/$4017 with the OUT0 latch and their 8-bit shift registers, and the OAM
# DMA unit at $4014. Neither belongs to the CPU, the PPU, the APU or the
# cartridge, so neither is gated with them. `no_std + alloc`, no dependencies.
# Depends on `dev-nes-apu` because the RP2A03's DMA unit is a single arbiter
# serving both halves of the chip -- OAM DMA at $4014 and the DMC's sample
# fetch -- and the DMC half is the APU's. Splitting the arbiter to break the
# dependency would model the silicon less accurately, not more.
dev-nes-io = ["dev-nes-apu"]

# The NES / Famicom picture processing unit (RP2C02): the per-dot rendering
# pipeline, $2000-$2007 with their quirks, the two-phase sprite evaluation and
# NMI generation. `machine-nes` will require it; on its own it is enough to run
# PPU conformance work against. `no_std + alloc`, no dependencies.
dev-nes-ppu = []

# The NTSC NES as a machine (machines/nes-ntsc.machine plus the classes it
# names). A machine is a feature set (ROADMAP.md §3), so this is the feature
# that makes `rsemu machines` list a NES and `rsemu run nes-ntsc --cart x.nes`
# work. Adds no dependencies; it is the components plus one data file.
#
# `dev-nes-ppu` is not optional here even though a headless CPU-only NES is a
# coherent idea: machines/nes-ntsc.machine names `nes.ppu`, so without it the
# machine does not realize at all — `unknown device class` at build time, not a
# picture-less console. The feature sweep only `cargo check`s, so a build that
# compiled and then failed the moment anyone ran it went unnoticed.
machine-nes = ["cpu-mos6502", "dev-nes-cart", "dev-nes-io", "dev-nes-ppu"]

# The Apple 1's chips (src/dev/apple1): the MC6821 PIA as that board wires it —
# keyboard on port A, a 40x24 character terminal on port B — the 256-byte
# monitor ROM socket at $FF00, and RSMON, rsemu's own monitor for it. `no_std +
# alloc` and dependency-free. Uses the character-device seam in `host::chardev`,
# which is `no_std` too; only its terminal backend needs `std`.
dev-apple1 = []

# The Apple 1 as a machine (machines/apple1.machine plus the classes it names).
# The smallest complete machine rsemu ships and the first one a person can type
# at: `rsemu run apple1` boots a monitor over the terminal. Adds no
# dependencies.
machine-apple1 = ["cpu-mos6502", "dev-apple1"]

# The RISC-V core (src/cpu/riscv): an RV64GC interpreter — RV64I/RV32I with
# M, A, F, D, Zicsr, Zifencei and C — plus the machine/supervisor/user
# privileged architecture, Sv39/Sv32 paging with a software TLB, and PMP. The
# `F`/`D` extensions are implemented in **software** IEEE-754 (`ROADMAP.md`
# §9.1), so guest floating point is bit-reproducible across hosts. RV32 is a
# construction property rather than a build flag, so one build runs both. Adds
# no dependencies and is `no_std + alloc`.
cpu-riscv = []

# The WDC 65xx peripherals (src/dev/wdc): the W65C51N ACIA as a character
# device, the W65C22 VIA with both ports and both timers, and the 32 KiB
# program EEPROM socket a 6502 breadboard computer boots from — plus
# RSMON/serial, rsemu's own monitor for it. `no_std + alloc` and
# dependency-free. Uses the character-device seam in `host::chardev`, which is
# `no_std` too; only its terminal backend needs `std`.
dev-wdc = []

# Ben Eater's 6502 breadboard computer as a machine
# (machines/beneater-6502.machine plus the classes it names): a 6502 at 1 MHz,
# 16 KiB of RAM, a serial console on the ACIA, a VIA, and 32 KiB of ROM.
# `rsemu run beneater-6502` boots a monitor over the terminal. Adds no
# dependencies.
machine-beneater = ["cpu-mos6502", "dev-wdc"]

# The SPI bus (src/bus/spi): the fabric, the peripheral seam, and a generic
# memory-mapped controller. Models the link **both ways** and makes the choice a
# machine-description property rather than an accident (docs/buses/low-speed.md):
# `transactional` hands a whole word to the slave in one call, `wired` drives
# SCK/MOSI/CS as real wires one edge per half bit period on the scheduler, which
# is what guest firmware that bit-bangs the same pins through GPIO needs. Covers
# the four CPOL/CPHA modes, 1-32 bit words, MSB/LSB first, eight chip selects and
# genuine full duplex. A peripheral implements the word-level `SpiSlave` once and
# gets the bit-level front end free. `no_std + alloc`, no dependencies.
bus-spi = []

# The USB bus (src/bus/usb): the fabric, the device seam, descriptors and the
# default control pipe. **Controller-agnostic**, which is the whole point
# (docs/buses/usb.md): a device model is written against transactions — SETUP,
# IN, OUT — and every one of the four transfer types is a sequence of those, so
# the same model answers an EHCI today and a UHCI or an xHCI later with no
# change. Covers addressing and enumeration (USB 2.0 §9.4's eleven standard
# requests, including SET_ADDRESS's deferred effect), descriptors (§9.6),
# endpoints, halt conditions, the three speeds and a port model with connect and
# enable. Hubs and split transactions are deliberately absent and the module says
# so. `no_std + alloc`, no dependencies.
bus-usb = []

# A generic EHCI host controller (src/dev/usb/ehci.rs): the EHCI 1.0 capability
# and operational register file, and — the part that matters — the **schedule
# walker**. A driver builds queue heads and queue element transfer descriptors
# in guest RAM, hands over ASYNCLISTADDR and PERIODICLISTBASE, and the
# controller DMA-walks them as a bus master with its own `MemAttrs::requester`,
# moving bytes between guest memory and USB devices and raising a level
# interrupt when a descriptor with IOC retires. Control and bulk on the
# asynchronous list, interrupt on the periodic one with its microframe S-mask;
# short packets, the alternate-next pointer, data toggles, STALL-to-halt, the
# async-advance doorbell, and the port-owner handover that is how a high-speed-
# only controller honestly refuses a full-speed device. **Every loop over a
# guest-built list is bounded**, and `fuzz/fuzz_targets/usb_ehci.rs` is why.
# Isochronous nodes are followed and not executed, and the module says so.
# Written from the freely available EHCI 1.0 specification; the Linux USB stack
# is GPLv2 and was not opened (ROADMAP.md §1). Needs `bus-usb`.
dev-usb-ehci = ["bus-usb"]

# The ChipIdea/ARC dual-role USB controller (src/dev/usb/chipidea.rs): a **thin
# wrapper** over `dev-usb-ehci`, and thin is the claim being made — it contains
# no schedule walker, no qTD decoding and no DMA, only a register map. What
# distinguishes the block is an ID register whose format makes the CX92755's
# 0xFA05 fall out of ID=5, the capability registers at +0x100 with CAPLENGTH
# 0x40 so the operational ones sit at **+0x140**, the device-controller
# capability registers, and a USBMODE role select. Host mode is complete;
# device mode is modelled far enough to satisfy firmware that selects it (the
# host schedule stops) and no further. The addresses are machine-file
# properties, never constants: this is one SoC's placement of a reusable core.
# Needs `dev-usb-ehci`.
dev-usb-chipidea = ["dev-usb-ehci"]

# A USB HID boot-protocol mouse (src/dev/usb/hid.rs): the smallest honest device
# that proves the whole stack — it enumerates, it answers the eleven standard
# requests through the shared control pipe, it returns a HID report descriptor,
# and it delivers three-byte reports on an interrupt IN endpoint that a host
# controller polls once a millisecond. **High speed**, deliberately: EHCI cannot
# drive a full- or low-speed device without a transaction translator, and this
# tree has no hub, so a device that claimed to be low speed would be a device
# that never enumerated. Written from USB 2.0 §9, HID 1.11 and the HID Usage
# Tables. Needs `bus-usb`.
dev-usb-hid = ["bus-usb"]

# The Sitronix ST7272A (src/dev/sitronix): a 320RGBx240 dual-gate TFT panel
# driver, configured over 3-wire SPI. Its **SPI carries registers only** —
# power, gamma, contrast, brightness, scan direction, standby — while pixels
# arrive on a separate parallel-RGB input, which is what makes it unlike an
# ST7735 or ST7789 and why this device has no framebuffer and no scanout. The
# full register map of datasheet v0.5 §8.1, VSYNC-latched command shadowing
# (§7.1(c)), the BIST patterns (§12.1), and the colour pipeline of §8.2.2-§8.2.7
# so a firmware that dims the panel produces a dimmer picture. Needs `bus-spi`.
dev-st7272a = ["bus-spi"]

# A generic RGB scanout engine (src/dev/lcd): the half of a display path that
# owns *where the pixels are* — a framebuffer base in an address space, a
# geometry, a pixel format, a stride, and a frame period derived from a clock
# domain — reading guest memory directly and presenting `host::display::Scanout`.
# The parallel-RGB link itself is deliberately **not** modelled: no guest can
# observe a pixel clock or a DE edge, so it is three numbers rather than a bus.
# A real SoC's display controller is a thin register wrapper over this engine.
# `no_std + alloc`, no dependencies.
dev-lcdc = []

# The `spi-panel` board (machines/spi-panel.machine plus the classes it names):
# an RV32 hart, RAM holding a framebuffer, an SPI controller, a Sitronix ST7272A
# on the far end of it, and a scanout engine that turns the framebuffer into a
# picture. It models no product — it exists so the SPI bus and the display
# devices have somewhere real to run, and so `rsemu run spi-panel` draws
# something. The machine file writes down which SPI modelling style it uses, and
# `-p link=transactional` switches it. Adds no dependencies.
machine-spi-panel = ["cpu-riscv", "bus-spi", "dev-st7272a", "dev-lcdc"]

# Level-3 execution (src/usermode): running a program with no guest kernel
# under it, `qemu-user`/gVisor-shaped (ROADMAP.md §2, phase 5b). The four
# things a syscall kernel cannot build for itself and rsemu owns because they
# are hardware: a memory map with no devices in it, a scheduling contract for
# guest threads, virtual time that advances by executed ticks, and the
# record/replay funnel every non-deterministic answer passes through. The
# syscall exit itself is in `core::exec` and is never gated, because it is a
# property of a core.
#
# Deliberately **not** here: a syscall table, file descriptors, errno, a
# process model, an ELF loader. §2.1 puts those in `KarpelesLab/nixvm`, which
# depends on this crate rather than being merged into it. Adds no dependencies
# and is `no_std + alloc`, because the browser is a level-3 target too.
usermode = []

# The MOS 6502 core (src/cpu/mos6502): a cycle-accurate interpreter with every
# documented and undocumented opcode, a disassembler generated from the same
# table, and the RP2A03 (NES) variant selected by a construction property. Adds
# no dependencies and is `no_std + alloc`.
cpu-mos6502 = []

# The A-profile ARM core (src/cpu/arm/aprofile): today an ARM926EJ-S-class
# ARMv5TE interpreter with the full ARM and Thumb instruction sets,
# interworking, the DSP (E) extensions, all seven modes with their banked
# registers and the complete exception model, plus a disassembler generated
# from the same decoders. The MMU, caches and TCMs are not included: CP15
# attaches through the `cp::Coprocessor` and `cp::Mmu` traits so a downstream
# SoC crate supplies its own, and a flat identity map is the default.
#
# Named for the profile, not the version, because ARMv6 and ARMv7-A share this
# core's whole shape -- A32 plus Thumb, banked modes, CP15, the exception model
# -- and select their differences with a construction property rather than a
# module of their own (ROADMAP.md §6.1.1). The M profile shares none of it and
# is a separate core.
#
# Adds no dependencies and is `no_std + alloc`.
cpu-arm-aprofile = []

# The `arm926` board (machines/arm926.machine plus the classes it names): a bare
# ARM926EJ-S SoC skeleton -- an ARMv5TE core, a boot ROM at the reset vector,
# DRAM, and one peripheral aperture, with every address a `param` because an ARM9
# SoC's memory map belongs to the SoC rather than to the architecture. It models
# no product; it exists so `cpu.arm` has somewhere to run inside a machine file,
# and so a downstream SoC starts from a file it copies rather than from nothing.
# No CP15: the core's coprocessor seam is a Rust trait and a machine file cannot
# yet name one, so the board runs on the flat identity map. Adds no dependencies.
machine-arm926 = ["cpu-arm-aprofile"]

# The RISC-V `virt` board's chips (src/dev/riscv): the CLINT, the PLIC, a 16550
# UART on the character-device seam, a system controller, virtio-MMIO with block
# and entropy devices, and a **device tree generator** that emits the DTB from
# the realized machine graph rather than from a file somebody wrote by hand.
# `no_std + alloc`, no `unsafe`, no dependencies. Written from the RISC-V
# privileged/PLIC/ACLINT specifications, the PC16550D data sheet, OASIS VIRTIO
# 1.2 and the Devicetree Specification.
dev-riscv = []

# Parallel NOR flash (src/dev/flash/cfi): the Common Flash Interface query
# structure and the Intel/Sharp extended command set (CFI id 0x0001) -- status
# register, word program, the 0xe8 write buffer, block erase and the block lock
# bits -- with the semantics that make flash *flash*: a program can only clear
# bits, an erase costs a whole block, blocks may differ in size, and a read
# during a command answers with status rather than data. Models an interleaved
# bus honestly, so the two x16 parts a board hangs on 32 bits each have their
# own state machine. The backing store is a media slot, not `fstool`: the
# contents are a flat image, and a disk-image crate would drag `std` into a
# `no_std` device for nothing. Written from JEDEC JESD68.01 and the Intel
# StrataFlash P30 datasheet. `no_std + alloc`, no dependencies.
#
# This is the device a UEFI build needs to *keep* a variable: the write path is
# what installs `gEfiVariableWriteArchProtocolGuid`, and RAM cannot provide it.
dev-flash-cfi = []

# The RISC-V `virt` board as a machine (machines/riscv-virt.machine plus the
# classes it names): the first machine rsemu can boot real system software on.
# `rsemu run riscv-virt --firmware fw.bin` loads an image at 0x80000000, hands
# it a generated device tree in a1 and the hart id in a0, and puts its console
# on the terminal. Adds no dependencies.
machine-riscv-virt = ["cpu-riscv", "dev-riscv", "dev-flash-cfi"]

# The ARMv7E-M core (src/cpu/arm/v7m): a Cortex-M4/M7-class interpreter —
# the whole T32 instruction set in both encoding widths, `IT` blocks, the DSP
# (E) extension (SIMD add/sub, saturating arithmetic, the half-word and dual
# multiplies), Handler/Thread modes with MSP and PSP, automatic register
# stacking with EXC_RETURN and tail-chaining, the HardFault/MemManage/BusFault/
# UsageFault taxonomy with its status registers, and the memory-mapped NVIC,
# SysTick, SCB and MPU at 0xE000E000. No A32 decoder: this architecture has no
# ARM state, so a Cortex-M build links none. The FPv4-SP/FPv5 floating-point
# unit is *not* implemented; CPACR reads zero so a coprocessor access raises a
# NOCP UsageFault, as it would on a part without the option. Independent of
# `cpu-arm-aprofile` — the two share the `arm` family module and nothing else.
# Adds no dependencies and is `no_std + alloc`.
cpu-arm-v7m = []

# STM32 peripherals (src/dev/stm32): a GPIO port and a USART, as separate
# classes a `.machine` file places at the addresses its reference manual gives
# them. The GPIO is the whole F4 register file -- MODER/OTYPER/OSPEEDR/PUPDR,
# IDR/ODR, the atomic BSRR, the LCKR key sequence and both AFR halves -- plus a
# real pin mux: MODER selects whether ODR, an alternate-function peripheral, or
# whatever is driving the pin from outside reaches the port's output wire. The
# USART is on the character-device seam and ships **both** register layouts,
# selected by a construction property, because ST redesigned the peripheral
# between the F4 and the F7 and the two are not compatible: `SR`/`DR` with a
# read-read flag clear against `ISR`/`RDR`/`TDR` with an `ICR`. Neither device
# knows what board it is on. Written from ST RM0090 (F4) and RM0410 (F7); no
# emulator source was consulted (ROADMAP.md §1). `no_std + alloc`, no `unsafe`,
# no dependencies.
dev-stm32 = []

# The STM32F407 as a machine (machines/stm32f407.machine plus the classes it
# names): a Cortex-M4 at 168 MHz, 1 MiB of flash aliased at zero, the three
# SRAM banks, five GPIO ports and USART2 on the terminal. The first M-profile
# board rsemu ships, and the one that answers "how does a peripheral raise an
# interrupt on a core whose NVIC is inside it" -- `wire usart2.irq -> cpu.irq38`,
# with the number coming from RM0090 Table 62 and living in this file rather
# than in any device model. Adds no dependencies.
machine-stm32f407 = ["cpu-arm-v7m", "dev-stm32"]

# The Zilog Z80 core (src/cpu/z80): a cycle-accurate interpreter covering the
# base, CB, ED, DD/FD and DDCB/FDCB pages, the undocumented IX/IY halves, SLL
# and the DDCB register copies, the MEMPTR (WZ) latch and flag bits 3 and 5,
# interrupt modes 0/1/2 with NMI, and a **separate I/O address space** the
# machine supplies. A disassembler is generated from the same tables. Adds no
# dependencies and is `no_std + alloc`.
cpu-z80 = []

# The `z80-mini` board (machines/z80-mini.machine plus the classes it names):
# ROM at the reset vector, RAM above it, and a **second address space** for the
# 64 KiB of ports `IN` and `OUT` reach -- the thing a Z80 has and no
# memory-mapped core in this crate does. It models no product; it exists so
# `cpu.z80` has somewhere to run inside a machine file and so the I/O space has
# a board that exercises it. No interrupt controller: mode 2 needs a device that
# answers the acknowledge cycle, and there is none to wire yet. Adds no
# dependencies.
machine-z80-mini = ["cpu-z80"]

# The Sharp SM83 core (src/cpu/sm83): the Game Boy's processor, an M-cycle
# accurate interpreter with all 256 base and 256 $CB encodings, the eleven
# unimplemented opcodes modelled as the lock-up they are, the HALT bug, EI's
# one-instruction delay, and the interrupt dispatch whose vector is chosen after
# the return address is pushed. `IF` and `IE` are regions of this device and its
# five interrupt inputs are edge-triggered wire pins, which is what gives STAT
# blocking for free. A disassembler is generated from the same table. Adds no
# dependencies and is `no_std + alloc`.
cpu-sm83 = []

# The Game Boy's chips (src/dev/gb): the LCD controller with its four modes,
# variable mode-3 length, level-driven STAT and VBlank lines and OAM DMA; the
# divider and timer with the falling-edge detector that makes a DIV write clock
# TIMA and shift every sound envelope; four sound channels driven by that same
# 512 Hz output over an ordinary wire; the cartridge header with ROM-only, MBC1,
# MBC2, MBC3 (real-time clock included, on the cartridge's own crystal) and
# MBC5; the joypad matrix; and the serial port, which is how a headless test ROM
# reports its result. `no_std + alloc` and dependency-free.
dev-gb = []

# The Game Boy as a machine (machines/gameboy.machine plus the classes it
# names). `rsemu run gameboy --cart tetris.gb`. Phase 4's genericity proof:
# a machine that is not NES-shaped, on the same core. Adds no dependencies.
machine-gameboy = ["cpu-sm83", "dev-gb"]

# The Sega Master System's chips (src/dev/sms): the 315-5124 VDP with mode 4 --
# four bitplanes, 32 colours, per-tile flip and priority, hardware scroll and
# the programmable line interrupt -- plus the four TMS9918A legacy modes it
# inherits; the SN76489 PSG with its three square channels, noise shift register
# and 4-bit attenuators; Sega's standard cartridge mapper with three 16 KiB
# slots, a fixed first kilobyte and cartridge RAM; the two control ports at
# $DC/$DD with $3E/$3F, the Reset button and Pause wired to /NMI; and the SDSC
# debug console at $FC/$FD, which is how a Master System test ROM reports a
# result without a screen. `no_std + alloc` and dependency-free.
dev-sms = []

# The Master System as a machine (machines/sms-ntsc.machine and
# machines/sms-pal.machine plus the classes they name).
# `rsemu run sms-ntsc --cart game.sms`. The second half of phase 4's genericity
# proof: a Z80 with a **separate I/O address space**, a VDP and pads that live
# in it rather than in memory, and one address that is the sound chip on a write
# and the VDP's counters on a read. Two files rather than one with a flag,
# because the region changes the oscillator and the frame height, and
# ROADMAP.md 4.2 makes that part of the machine's identity. Adds no
# dependencies.
machine-sms = ["cpu-z80", "dev-sms"]

# The Intel x86 core (src/cpu/x86): one interpreter covering the 8086, the
# 8088, the 80386 and the 80486, chosen by a construction property rather than
# a build flag. Real mode with every documented and undocumented 8086 encoding
# and the segment:offset wrap at 1 MiB; and, on the 32-bit parts, protected
# mode with the descriptor tables and the hidden descriptor caches, privilege
# levels, call/interrupt/trap/task gates, the task state segment and task
# switching, two-level paging with a translation-lookaside buffer and page
# faults, the full exception model including the double fault, the two-byte
# `0F` opcode page, and CPUID. A separate I/O address space, the prefetch
# queue, and a disassembler generated from the same tables. Gated against
# SingleStepTests/8088 — a corpus captured from real silicon — run both as an
# 8088 and as a 386. Adds no dependencies and is `no_std + alloc`.
cpu-x86 = []

# The chips an IBM PC/AT-class board is built from (src/dev/pc): two 8259A
# interrupt controllers, an 8254 timer, an 8042 keyboard controller with the
# A20 gate, an MC146818 RTC and its CMOS RAM, two 8237A DMA controllers with
# the AT's page registers, the system control ports at 0x61 and 0x92, and the
# firmware ROM socket a user-supplied BIOS image is bound to. Written from the
# IBM PC/AT Technical Reference, the Intel and Motorola data sheets and Ralf
# Brown's Interrupt List; no emulator source was consulted (ROADMAP.md §1).
# `no_std + alloc`, no dependencies.
dev-pc = []

# The PC's display side (src/dev/pc/video): an MC6845-derived CRTC, the
# attribute-plus-character text buffer at 0xb8000, and the character generator
# that turns the two into pixels on the `host::display` scanout seam — so a
# `--screenshot` and the browser demo see the same picture the guest drew. Text
# mode only, deliberately: it is what reaches a DOS prompt, and a graphics mode
# nothing yet asks for would be untested code. Needs `dev-pc`.
dev-pc-video = ["dev-pc"]

# The PC's floppy controller (src/dev/pc/fdc): a NEC uPD765A as the AT wires
# it, with the command phases, the result phases, seek and interrupt handling,
# and both DMA and non-DMA data transfer. Needs `dev-pc` for the DMA controller
# it hands bytes to.
dev-pc-floppy = ["dev-pc"]

# An IBM PC/AT-class machine (machines/pc-at.machine plus the classes it
# names). The firmware is **not** shipped: the `bios` media slot takes the
# user's own image (`rsemu run pc-at --bios /usr/share/qemu/bios.bin`) and the
# `vgabios` slot takes a video option ROM, exactly as `riscv-virt` takes its
# firmware. Adds no dependencies.
machine-pc-at = ["cpu-x86", "dev-pc", "dev-pc-video", "dev-pc-floppy"]

# The Motorola MC68000 core (src/cpu/m68k): an interpreter that models the
# two-word prefetch queue explicitly, charges four cycles per bus access rather
# than reading a per-instruction table, implements the supervisor/user split
# with both stack pointers, and takes every 68000 exception with the right
# stack frame — including the fourteen-byte group-0 frame an address error
# pushes. Ships a disassembler generated from the same instruction description.
# The plain 68000 of the Amiga, Atari ST, Mega Drive and early Macs; not the
# 010 or the 020. Adds no dependencies and is `no_std + alloc`.
cpu-m68k = []

# The `m68k-mini` board (machines/m68k-mini.machine plus the classes it names):
# a big-endian 24-bit space, ROM at zero holding the exception vector table and
# the two longwords a 68000 fetches out of reset, and RAM above it. It models no
# product; it exists so `cpu.m68k` has somewhere to run inside a machine file.
# Nothing raises an interrupt on it: the core's three `IPL` pins carry an
# encoded priority level rather than a request, and there is no priority encoder
# to wire. Adds no dependencies.
machine-m68k-mini = ["cpu-m68k"]

[[bench]]
# The frame-time benchmark (ROADMAP.md §13's phase-3 gate). `harness = false`
# because libtest's bench harness is nightly-only and this project is stable,
# and because the gate wants a *percentile* rather than the mean libtest would
# print: a `main` that times its own loop is both shorter and closer to what is
# being asked for. No `criterion` — the dependency policy is absolute (§0), and
# it would be the crate's only non-first-party edge.
name    = "frame_time"
harness = false

[lib]
name = "rsemu"
path = "src/lib.rs"
# Native builds stay lean (rlib only); the wasm cdylib is produced on demand
# with `cargo rustc --crate-type cdylib`, so no platform pays for the other's
# link step.
crate-type = ["rlib"]

[[bin]]
name              = "rsemu"
path              = "src/bin/rsemu.rs"
required-features = ["cli"]

[lints.rust]
# Six subsystems may opt back in with a scoped #[allow(unsafe_code)] and a
# SAFETY comment; see ROADMAP.md §0. Six is the ceiling.
unsafe_code       = "deny"
missing_docs      = "warn"
unreachable_pub   = "warn"

[lints.clippy]
# Guest arithmetic wraps by definition, so the intent must be spelled out at
# every site rather than inherited from the build profile (CLAUDE.md).
arithmetic_side_effects = "allow"

[profile.release]
lto           = "thin"
codegen-units = 1

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
