name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # A CI job compiles each configuration exactly once, so an incremental cache
  # is written and never read. It is not free: locally, where the same commands
  # run over and over across worktrees, `target/debug/incremental` reached
  # 246 GB — larger than every compiled artifact in the tree put together. Off
  # everywhere, and `scripts/check.sh` sets the same.
  CARGO_INCREMENTAL: 0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The other half of the matrix, and the one ROADMAP §0 cares about: a
      # lint that only fires when `std` is absent is invisible to the run
      # above, which has every feature on. Cheap — the crate is much smaller
      # with the defaults dropped.
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and undocumented public items are invisible to
      # clippy, so they need their own gate — missing_docs is only a warning
      # until something turns warnings into errors.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo test --all-features
      # The default build is what users get; it must stand on its own.
      - run: cargo test
      # The frame-time benchmark is a measurement, never a gate: a shared
      # runner's timings are noise, and a perf threshold checked here would be
      # a flake generator. What *is* checked is that the harness still runs and
      # that its guests still reach the state hashes tests/goldens records —
      # a benchmark whose guest quietly stopped working looks like a speedup.
      # `--smoke` makes that a couple of seconds. One OS is enough; the numbers
      # are not the artefact.
      - name: frame-time benchmark harness
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --all-features --bench frame_time -- --smoke

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so the rust-version in Cargo.toml is a checked claim rather than
      # a comment that drifts.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features

  no_std:
    name: no_std core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The emulation core must never depend on std (ROADMAP.md §0). A std leak
      # is a build break, not a style nit, so it is checked every commit.
      - run: cargo build --no-default-features
      - run: cargo test --no-default-features

  features:
    # Six shards of the same sweep. Sequentially this was a hundred and one
    # `cargo test` runs on one runner; split, it is the same CPU-minutes in a
    # sixth of the wall time, which is what buys room for the combination job
    # below without the workflow getting slower.
    name: feature sweep ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Each shard compiles a different set, so one shared cache key would
          # have six jobs overwriting each other's entry every run.
          key: sweep-${{ matrix.shard }}
      # Cargo features are additive-only, so a component that silently needs a
      # sibling feature passes --all-features forever and breaks for the first
      # user who picks a narrow set. Build each feature alone.
      - name: each feature in isolation
        # Enumerated from the manifest rather than listed here: a hand-written
        # list silently stops covering the feature added after it was written,
        # which is exactly the feature most likely to have the bug.
        run: |
          set -uo pipefail
          df -h .
          cargo build --no-default-features || exit 1
          feats=$(python3 scripts/feature-matrix.py features | awk "NR % 6 == ${{ matrix.shard }} % 6")
          echo "shard ${{ matrix.shard }}/6 sweeping: $feats"
          failed=""
          for f in $feats; do
            echo "::group::$f"
            # `cargo test`, not `check`: three bugs shipped past a
            # compile-only sweep in one day. `machine-nes` did not imply
            # `dev-nes-ppu`, and `machine-pc-at` and `machine-gameboy` had
            # media fixtures gated on `std` as well as their own feature --
            # every one of them compiles under every feature set and dies at
            # realize. A sweep that only compiles cannot see that; running the
            # feature's own tests can.
            #
            # This became possible only once narrow-feature runs were
            # deterministic: the `single` backend's locks were racy under
            # libtest's threads, so this job would have been a flake
            # generator. See `core::sync`'s `single` module.
            cargo test --no-default-features --features "$f" || failed="$failed $f"
            # Every feature set has its own metadata hash, so no iteration can
            # reuse the previous one's artifacts — they only pile up, and a
            # hundred of them is tens of gigabytes against a runner's fourteen.
            # Dropping this crate's artifacts costs nothing that would have
            # been reused and makes the sweep's disk use O(1) instead of
            # O(features). A build that dies on a full disk fails exactly like
            # a build that is broken, which is the worst kind of red.
            cargo clean -p rsemu || true
            echo "::endgroup::"
          done
          # Every failure, not the first: the point of a sweep is the list of
          # what is broken. `::error::` puts each one in the run's annotations,
          # at the top of the page, because a summary line at the end of forty
          # thousand lines of log has already been missed twice -- and both
          # times the thing missed was a `std`-only construct in a `no_std`
          # feature, which no other job in this workflow can see.
          df -h .
          if [ -n "$failed" ]; then
            for f in $failed; do
              echo "::error title=feature sweep::--no-default-features --features $f FAILED"
            done
            echo "SWEEP FAILED:$failed"
            exit 1
          fi
          echo "sweep shard ${{ matrix.shard }} ok"

  feature-combinations:
    name: feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: combos
      # The gap the sweep above cannot close on its own, stated exactly,
      # because it is easy to overstate. Cargo features are additive, so
      # `--all-features` compiles every conjunction of them: no gated code in
      # this crate is *uncompiled*. But `--all-features` also turns `std` on,
      # and the sweep -- the only job that builds without `std` -- never turns
      # two features on at once. So code gated on a *pair* of `no_std`
      # features has only ever been compiled with `std` present, and a `std`
      # -only construct in it reaches master exactly the way one did twice
      # already (`fw-pcbios`, `cpu-arm-a64`). `src/cpu/riscv/engine.rs`
      # (`all(cpu-riscv-lift, jit)`) is one of thirty-four such gates.
      #
      # The pairs are derived from the tree by `scripts/feature-matrix.py` --
      # from `cfg` predicates *and* from module nesting, so a `#[cfg(A)] mod`
      # containing a `#[cfg(B)]` item counts too -- and never listed here,
      # because a list stops covering the gate added after it was written.
      # They are then merged into as few builds as cover them: the union of
      # two `no_std` sets is still `no_std`, and turning more features on
      # cannot stop a gate from compiling.
      - name: derive and build the combinations
        run: |
          set -uo pipefail
          python3 scripts/feature-matrix.py plan
          failed=""
          while read -r set_; do
            [ -n "$set_" ] || continue
            echo "::group::$set_"
            cargo test --no-default-features --features "$set_" || failed="$failed $set_"
            cargo clean -p rsemu || true
            echo "::endgroup::"
          done < <(python3 scripts/feature-matrix.py merged)
          if [ -n "$failed" ]; then
            for f in $failed; do
              echo "::error title=feature combination::--no-default-features --features $f FAILED"
            done
            exit 1
          fi

  deps:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # Both halves of the rule. The default build pulls in nothing at all, and
      # the *feature-enabled* tree is inspected too — ROADMAP §0 says it is
      # checked and, until now, only the default half was. The script says what
      # it gates on and what it merely reports, and why; `scripts/check.sh`
      # runs the same file, so the local answer and this one cannot differ.
      - name: dependency policy
        run: ./scripts/deps-policy.sh

  wasm:
    name: wasm (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip1-threads]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The browser demo is a Vue 3 + Vite application, and check.mjs is gated
      # on the *built* site as well as on the module, so this job needs node.
      # Only wasm32-unknown-unknown builds a page.
      - uses: actions/setup-node@v4
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # wasm rots faster than anything else, so every wasm target is built on
      # every commit from the first one (ROADMAP.md §11). Building is all this
      # job does for the two WASI targets; *running* them is `crosshost`
      # (wasm32-wasip1, under Node's WASI) and `wasm-threads`
      # (wasm32-wasip1-threads, under wasmer).
      - name: build library
        run: cargo build --target ${{ matrix.target }} --no-default-features --features wasm
      - name: build browser cdylib
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features wasm --release
      - name: check exported ABI
        if: matrix.target == 'wasm32-unknown-unknown'
        # A module that compiles but exports nothing is useless to the web
        # harness, and the failure is silent. Assert the symbols exist.
        run: |
          python3 - <<'PY'
          import sys
          d = open('target/wasm32-unknown-unknown/release/rsemu.wasm','rb').read()
          assert d[:4] == b'\0asm', 'not a wasm module'
          def uleb(d, i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          names, i = set(), 8
          while i < len(d):
              sid = d[i]; i += 1
              size, i = uleb(d, i); end = i + size
              if sid == 7:
                  n, j = uleb(d, i)
                  for _ in range(n):
                      ln, j = uleb(d, j); names.add(d[j:j+ln].decode()); j += ln
                      j += 1; _, j = uleb(d, j)
              i = end
          want = {'memory', 'rsemu_echo', 'rsemu_version_ptr', 'rsemu_version_len'}
          missing = want - names
          print('exports:', sorted(names))
          if missing:
              sys.exit(f'missing exports: {sorted(missing)}')
          PY
      # The demo is the only configuration the browser page actually loads, and
      # `wasm` alone does not exercise it. Built after the ABI check above so
      # that check keeps testing the minimal module, not this one.
      - name: build the demo cdylib
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features demo --release
      # `npm ci`, not `npm install`: the lockfile is committed and it is the
      # build's input. The licence gate runs here too, because a copyleft
      # package arriving transitively would end up inside the bundle that
      # ships (CLAUDE.md's provenance rule does not stop at the language
      # boundary).
      - name: install the site's dependencies
        if: matrix.target == 'wasm32-unknown-unknown'
        run: npm ci
        working-directory: web
      - name: check bundled licences
        if: matrix.target == 'wasm32-unknown-unknown'
        run: npm run licenses
        working-directory: web
      - name: build the site
        if: matrix.target == 'wasm32-unknown-unknown'
        # public/ is copied verbatim by Vite, so the wasm reaches dist/ whole:
        # not hashed, not inlined, not transformed.
        run: |
          set -euo pipefail
          cp target/wasm32-unknown-unknown/release/rsemu.wasm web/public/rsemu.wasm
          npm run build --prefix web
      - name: browser harness against the real module and the real site
        if: matrix.target == 'wasm32-unknown-unknown'
        # Instantiates the module and drives it: exports vs. what the glue
        # calls, zero imports, the built bundle still calling every one of them
        # and referencing only relative assets that exist, boot, frames,
        # save/restore hash equality, and the page's own frame loop under a
        # stub canvas. Not a DOM test -- nothing here has a browser -- but it
        # catches every drift that is not one.
        run: node web/check.mjs web/dist/rsemu.wasm --site web/dist
      - uses: actions/upload-artifact@v5
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          name: rsemu-wasm
          path: target/wasm32-unknown-unknown/release/rsemu.wasm
          if-no-files-found: error

  crosshost:
    name: crosshost (i686, wasm32-wasip1)
    runs-on: ubuntu-latest
    # Phase 9's gate is "a recorded session replayed bit-identically on a
    # *different host*", and until this job nothing in this workflow ever left
    # x86-64. Every other job here — including the three-OS `test` matrix — is
    # 64-bit little-endian with the same `usize`, the same ABI and the same code
    # generator, so a snapshot or a recording that silently depends on any of
    # those passes all of them. `scripts/check.sh crosshost` is the stage that
    # asks the question, and it ran only when somebody ran the full local gate
    # by hand.
    #
    # Two second hosts, for two different reasons (the long form is the comment
    # above `stage_crosshost` in the script):
    #
    #   i686-unknown-linux-gnu   a 32-bit `usize` on an ISA this runner can also
    #                            *execute*, so `cargo test --target` runs the
    #                            binaries rather than just linking them.
    #   wasm32-wasip1            a 32-bit address space, a different code
    #                            generator and no native ABI at all, under
    #                            Node's WASI via `scripts/wasi-run.mjs`. CI has
    #                            built this target every commit since the first
    #                            one and, until now, ran it never.
    #
    # Its own job rather than steps bolted onto `wasm` or `test`: a failure here
    # is a portability defect in the state or replay seam, which is a different
    # diagnosis from "wasm does not build", and it should say so in the checks
    # list without anyone opening a log.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml already fetches the three wasm targets, so
          # wasm32-wasip1 is belt and braces; i686 is not in that file because
          # no other job wants it, and this is where it is added.
          targets: i686-unknown-linux-gnu, wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          # Three target directories nobody else in this workflow writes.
          key: crosshost
      # `node:wasi` is the whole wasm runtime — no wasmtime, no wasmer. `web/`
      # already assumes node, and the version is pinned here for the same
      # reason it is pinned in the `wasm` job: a runner's default node is not
      # part of this repository's contract.
      #
      # **24 rather than 22, and the difference is not cosmetic.** Under node 22
      # this job died with `signal: 11, SIGSEGV` inside `node` itself, part-way
      # through `machine::catalog::tests::every_shipped_machine_realizes` — the
      # process was killed, not the guest, so no test reported a failure and the
      # snapshot legs after it then failed for want of files that were never
      # written. Ruled out as a wasm shadow-stack overflow: the same job with a
      # 4 MiB stack (`scripts/check.sh`) crashed identically, and node 26 runs
      # the same module to completion on a developer's host. What is left is the
      # runtime, so the runtime is what moved.
      #
      # It could not be reproduced locally — there is no node 22 on the machine
      # that diagnosed it — so this is the change the evidence points at rather
      # than one that was watched to fail and then pass. If it comes back, the
      # next thing to try is `--stack-size` on the `node` invocation in
      # `scripts/check.sh`'s runner, and after that a runtime that is not node.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # rustc drives the linker through `cc` for i686-unknown-linux-gnu, and
      # links against a 32-bit libc: without the multilib packages the target
      # installs fine and every link fails at `crt1.o`. `gcc-multilib` pulls
      # `libc6-dev-i386`, which pulls `libc6-i386` — the second is what lets the
      # runner *run* the test binary (`/lib/ld-linux.so.2`), not just build it.
      - name: 32-bit toolchain and runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-multilib
      # Both prerequisites, asserted before a ten-minute build rather than
      # inside one. Neither failure is self-explanatory in a linker's output or
      # in cargo's runner error, and each has one obvious cause named above.
      - name: preflight
        run: |
          set -euo pipefail
          printf 'int main(void){return 0;}\n' > /tmp/m32.c
          cc -m32 /tmp/m32.c -o /tmp/m32
          /tmp/m32
          echo "cc -m32 links and the result runs"
          node --no-warnings=ExperimentalWarning \
            -e "import('node:wasi').then(m => {
                  if (!m.WASI) { console.error('node:wasi has no WASI export'); process.exit(1); }
                  console.log('node:wasi ok on ' + process.version);
                })"
      # The same stage `scripts/check.sh crosshost` runs locally, invoked as
      # itself so the two cannot drift: the feature set, the environment
      # variables that move a save state between the two processes, and
      # `--test-threads=1` (wasip1 has no `std::thread`) all live in one place.
      #
      # RSEMU_CROSSHOST_REQUIRED turns the script's skips into failures. Each
      # leg skips itself when its target or runtime is missing, which is right
      # on a developer's machine and useless here — a runner whose provisioning
      # broke would report a held gate that nothing was holding.
      - name: crosshost replay and snapshot portability
        env:
          RSEMU_CROSSHOST_REQUIRED: 1
        run: |
          # `|| rc=$?` rather than a bare pipeline: the step's shell is `bash -e`
          # and errexit would end it before the annotations below are written.
          # pipefail is what makes `$?` the script's status and not tee's.
          set -uo pipefail
          rc=0
          ./scripts/check.sh crosshost 2>&1 | tee crosshost.log || rc=$?
          # The script's own summary, not parsed test output: `record` writes
          # these lines and nothing else does. One annotation per failed leg,
          # because the verdict is otherwise the last screen of a long log.
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|skip) ' crosshost.log | while IFS= read -r line; do
              echo "::error title=crosshost::$line"
            done
          fi
          exit "$rc"

  wasm-threads:
    name: wasm threads (wasm32-wasip1-threads)
    runs-on: ubuntu-latest
    # ## Why this job exists
    #
    # `ROADMAP.md` §11.1 says `wasm32-wasip1-threads` "exercises every line of
    # the `wasm-atomics` sync backend. This is what CI gates on", and
    # `CLAUDE.md`'s Targets section calls it "the stable threaded target CI
    # gates on". What the `wasm` job above gates on is `cargo build`. Since the
    # first commit every wasm target has been *compiled* every time; the
    # `crosshost` job added execution for `wasm32-wasip1`; and the threaded
    # target — the only one where `core::sync`, the task pool, "submit jobs,
    # never spawn threads" and guest RAM in a `SharedArrayBuffer` can be
    # observed rather than type-checked — ran nothing at all.
    #
    # It is its own job for the reason `crosshost` is: a failure here is a
    # threading or portability defect, which is a different diagnosis from "the
    # wasm build broke", and the checks list should say which without anyone
    # opening a log.
    #
    # ## The runtime, and why it is not wasmtime
    #
    # This was tried rather than looked up, because three of the four obvious
    # answers do not work (the long form is in `scripts/wasi-threads-run.sh`):
    # wasmtime **removed** wasi-threads in 47.0.0 and `-S threads` is now a hard
    # error; 46.x accepts the flag and then refuses a module with a shared
    # memory; `node:wasi`, which `scripts/wasi-run.mjs` uses for the
    # non-threaded target, has no threads at all; and WAMR's published `iwasm`
    # rejects the module before threads are even reached. wasmer runs it as
    # shipped, and it is MIT, so running it raises nothing under CLAUDE.md's
    # provenance rule.
    #
    # ## What is not green, and why that is the point
    #
    # Four tests are skipped and `scripts/check.sh` names every one of them with
    # its reason beside it: three are `catch_unwind` under `panic = "abort"`,
    # which no wasm target can do, and one is `TcpListener::bind`, which WASI
    # preview 1 does not have. The remaining ~2400 run.
    #
    # It was ten when this job landed, and the other six were a defect this job
    # existed to find: `core::sync` selected the `single` backend for
    # `target_family = "wasm"` whatever the host's thread support, so the pool
    # had no workers and `single::Mutex` panicked the moment two guest cores
    # contended for a bus lock on two real host threads — two emulated cores
    # killing a browser page. The fix is the `wasm-threads` feature in
    # `WASM_THREADS_FEATURES`, which is why this job is the only place that
    # feature is exercised.
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-toolchain.toml already fetches this one, as it does for
          # `crosshost`; named here so the job does not depend on that file
          # keeping it.
          targets: wasm32-wasip1-threads
      - uses: Swatinem/rust-cache@v2
        with:
          # Its own target directory: the RUSTFLAGS below (`--max-memory`) give
          # every artifact a different metadata hash from the `wasm` job's.
          key: wasm-threads
      # Pinned, and only `bin/wasmer` out of the tarball — the archive is 306 MB
      # because it also ships two static libraries and a headless runtime, and
      # none of that is wanted here.
      - name: install wasmer
        env:
          WASMER_VERSION: v7.4.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wasmer.tar.gz \
            "https://github.com/wasmerio/wasmer/releases/download/${WASMER_VERSION}/wasmer-linux-amd64.tar.gz"
          mkdir -p /tmp/wasmer "$HOME/.local/bin"
          tar xzf /tmp/wasmer.tar.gz -C /tmp/wasmer bin/wasmer
          install -m 755 /tmp/wasmer/bin/wasmer "$HOME/.local/bin/wasmer"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Both prerequisites asserted before a ten-minute build rather than inside
      # one, in the shape `crosshost` established — and here the second one is
      # not "the runtime exists" but "the runtime really runs two threads at the
      # same instant". A runtime that serialised `thread_spawn` would run this
      # whole suite green while proving nothing, which is the failure mode
      # `RSEMU_CROSSHOST_REQUIRED` was invented for one job up.
      - name: preflight
        run: |
          set -euo pipefail
          wasmer --version
          cat > /tmp/overlap.rs <<'RS'
          use std::sync::Arc;
          use std::sync::atomic::{AtomicUsize, Ordering};
          // Two threads that only both return `true` if both are inside the
          // loop at the same moment. A runtime that runs the closure at spawn
          // time, or one that has a single scheduler slot, spins out and says
          // so instead of hanging.
          fn main() {
              let arrived = Arc::new(AtomicUsize::new(0));
              let hs: Vec<_> = (0..2)
                  .map(|_| {
                      let a = arrived.clone();
                      std::thread::spawn(move || {
                          a.fetch_add(1, Ordering::SeqCst);
                          let mut spins: u64 = 0;
                          while a.load(Ordering::SeqCst) < 2 {
                              spins += 1;
                              if spins > 100_000_000 {
                                  return false;
                              }
                              std::hint::spin_loop();
                          }
                          true
                      })
                  })
                  .collect();
              let ok = hs.into_iter().all(|h| h.join().unwrap_or(false));
              println!("two threads overlapped: {ok}");
              if !ok {
                  std::process::exit(1);
              }
          }
          RS
          rustc --edition 2021 -O --target wasm32-wasip1-threads \
            -o /tmp/overlap.wasm /tmp/overlap.rs
          # The module must import a *shared* memory, or the threads proposal is
          # not in play and the run below would prove nothing. The `wasm` job's
          # parser reads the memory section; this target has none, because the
          # memory is imported from `env`.
          python3 - <<'PY'
          import sys
          d = open('/tmp/overlap.wasm', 'rb').read()
          def uleb(d, i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          i, shared = 8, False
          while i < len(d):
              sid = d[i]; i += 1
              size, i = uleb(d, i); end = i + size
              if sid == 2:
                  n, j = uleb(d, i)
                  for _ in range(n):
                      ln, j = uleb(d, j); j += ln
                      ln, j = uleb(d, j); j += ln
                      kind = d[j]; j += 1
                      if kind == 0: _, j = uleb(d, j)
                      elif kind == 1:
                          j += 1; fl = d[j]; j += 1; _, j = uleb(d, j)
                          if fl & 1: _, j = uleb(d, j)
                      elif kind == 2:
                          fl = d[j]; j += 1; _, j = uleb(d, j)
                          if fl & 1: _, j = uleb(d, j)
                          shared = shared or bool(fl & 0x02)
                      elif kind == 3: j += 2
              i = end
          print('imports a shared memory:', shared)
          if not shared:
              sys.exit('the module is not threaded - this target stopped linking --shared-memory')
          PY
          wasmer run --volume /:/ -- /tmp/overlap.wasm
      # The same stage `scripts/check.sh wasm-threads` runs locally, invoked as
      # itself so the two cannot drift: the feature set, the `--max-memory` link
      # flag, `--test-threads=1` and the ten named skips all live in one place.
      #
      # RSEMU_WASM_THREADS_REQUIRED turns the script's skips into failures, for
      # the argument the `crosshost` job makes at length: this workflow installs
      # every prerequisite itself, so a leg that skips here means provisioning
      # broke, and a green job that ran nothing reports a gate as held that
      # nobody is holding.
      - name: threaded wasm suite
        env:
          RSEMU_WASM_THREADS_REQUIRED: 1
        run: |
          # `|| rc=$?` rather than a bare pipeline, and `pipefail` so `$?` is
          # the script's status and not tee's — same reasoning as `crosshost`.
          set -uo pipefail
          rc=0
          ./scripts/check.sh wasm-threads 2>&1 | tee wasm-threads.log || rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|skip) ' wasm-threads.log | while IFS= read -r line; do
              echo "::error title=wasm-threads::$line"
            done
          fi
          exit "$rc"

  aarch64:
    name: aarch64 (weak memory)
    # `ubuntu-24.04-arm`, and the label is not a guess. GitHub's hosted-runner
    # table lists exactly three Arm64 Linux labels — `ubuntu-24.04-arm`,
    # `ubuntu-22.04-arm` and `ubuntu-26.04-arm` — and Arm64 standard runners
    # went generally available for public repositories on 2025-08-07 and
    # reached private ones on 2026-01-29. This repository is public, so the
    # runner is free, unmetered and needs no opt-in, no organisation setting
    # and no larger-runner configuration: 4 vCPU and 16 GB, which is what the
    # litmus below needs two of.
    #
    # The other three candidates were rejected for reasons worth writing down,
    # because the failure mode of picking wrong is not a red build:
    #
    #   ubuntu-latest-arm   does not exist. An unmatched `runs-on` label does
    #                       not fail the job — it queues until something
    #                       cancels it, so a typo here is a workflow that
    #                       silently never runs.
    #   ubuntu-22.04-arm    deprecation begins 2026-09-17 with brownout windows
    #                       in March and April 2027 that fail jobs on purpose.
    #   ubuntu-26.04-arm    public preview, explicitly marked unstable and
    #                       subject to queueing. Not something a gate sits on.
    #
    # ## Why this job exists at all
    #
    # Three fixes shipped with no test that can fail on an x86-64 host, and
    # each says so in its own doc comment: the bus lock's two `SeqCst` fences
    # (`core::space::buslock`), the a64 core's acquire/release and barrier
    # fences (`cpu::arm::a64::Exec::host_fence`), and the JIT's `mfence`
    # lowering (`jit::x86`). Every one of them names
    # `tests/memory_model_litmus.rs` as where its row belongs "taken on a
    # weakly ordered host", and until this job there was no such host under a
    # run that could fail. The cause is specific rather than general: on x86-64
    # a relaxed read-modify-write is a `lock`-prefixed instruction and
    # therefore a full barrier, so `RamStore::mark_dirty`'s `fetch_or` and a
    # mutex's `cmpxchg` each supply by accident the ordering the fences supply
    # on purpose, and the two arms of every litmus read the same. On AArch64
    # that `fetch_or` is `ldsetr` and orders nothing.
    #
    # ## Why it is not enough that `macos-latest` is already Apple silicon
    #
    # It is, and the `test` matrix above therefore already compiles and runs
    # this crate on an aarch64 host. What it does not do is run the litmus in a
    # release build (`ROUNDS` is a tenth as large without one), run it in
    # required mode, or run it on **Linux** — and the host seam is where the
    # target actually shows: `host/signal.rs` is x86-64 Linux only and every
    # other target keeps `Arming::Unavailable`, and `accel/` does not exist off
    # it at all. This job is the Linux aarch64 leg; `macos-latest` remains the
    # Darwin one.
    #
    # ## What a green run here proves, and what it does not
    #
    # A weak-memory bug is probabilistic. The fenced rows assert **zero**
    # forbidden outcomes, and zero is sound on every host by the language's own
    # model — so a green tick on those rows, taken alone, proves nothing about
    # the fences. What this runner adds is the *unfenced* half of each pair:
    # the same critical section with the fences deleted, and the same guest
    # programs without the barrier, printed beside them. Where the unfenced arm
    # tears and the fenced arm does not, the fences are load-bearing; that
    # comparison is impossible on x86-64, where both arms are zero.
    #
    # And a litmus that finds nothing has failed to find something — it has not
    # shown there is nothing to find. 200 000 rounds per arm in a release build
    # is a search, not a proof. It found 13 forbidden outcomes per 200 000 in
    # the bare-relaxed control on the author's x86-64 host, and 0 through every
    # `lock`-prefixed path; what a weakly ordered runner is expected to add is
    # a non-zero count on the paths that are only ordered by accident there.
    # The number to read is never "the gate passed", it is the printed count
    # next to it, which is why `--nocapture` is not optional.
    #
    # ## The rows that run against a *machine*, and what they add
    #
    # `tests/memory_model_litmus.rs`'s `machine` module runs the same two
    # litmus shapes as guest programs on two boards that declare `threading
    # parallel` — `machines/tests/smp-parallel.machine` (two RV64 harts) and
    # `machines/tests/smp-parallel-a64.machine` (two Neoverse-N1-class cores).
    # They need no extra step: this job already runs the whole file, and they
    # are in it.
    #
    # They are a strictly stronger claim about the same fences — the scheduler,
    # the round rendezvous, the realizer, the address space and the RAM store
    # are all in the picture, where the rows above are two `Exec`s and a
    # `std::thread::scope`. They are also a **less sensitive instrument**, and
    # `docs/techniques/parallel-execution.md` has the measurement: between the
    # guest's store and the guest's load sits a whole interpreted instruction
    # plus per-access cycle accounting, which is tens of nanoseconds where the
    # host's store-buffer window is tens of nanoseconds too. So the
    # machine-level store-buffer rows read **zero in every arm, fenced and
    # unfenced alike**, on x86-64 and on this runner; the pair that means
    # something up there means nothing down here, and neither half is required.
    #
    # What `RSEMU_WEAK_MEMORY_REQUIRED` does turn into an assertion for those
    # rows is the collision witness: a plain, non-atomic increment both
    # processors perform every round, which must lose some. A run in which it
    # loses none is a run in which the board's two processors never landed
    # inside each other, and every zero it printed is vacuous — the same
    # argument the two required checks above make, at the level where "did the
    # two things overlap" is a property of the *scheduler* rather than of the
    # host.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # A target directory no other job in this workflow writes, and it
          # holds both profiles: this job builds release *and* debug.
          key: aarch64
      # The prerequisites, asserted before a ten-minute build rather than
      # inside one, in the shape the `crosshost` job established. Neither
      # failure is self-explanatory afterwards: a job that ran on the wrong
      # architecture reports green litmus rows that mean nothing, and a job
      # with one core reports "the two threads never overlapped", which reads
      # like a defect and is not one.
      - name: preflight
        run: |
          set -euo pipefail
          arch=$(uname -m)
          echo "uname -m: $arch"
          rustc -vV
          nproc
          if [ "$arch" != aarch64 ]; then
            echo "::error title=aarch64::runner reports $arch; the litmus below would prove nothing"
            exit 1
          fi
          # Captured, not piped into `grep -q`. Under the `pipefail` above,
          # `rustc -vV | grep -qx …` fails the *pipeline* whenever `grep`
          # matches early enough to close the pipe before `rustc` has finished
          # writing: `rustc` takes SIGPIPE, and `pipefail` reports the death of
          # the producer rather than the success of the consumer. That is a
          # race, and it lost — this step failed with "rustc is not native"
          # printed directly beneath `rustc -vV`'s own
          # `host: aarch64-unknown-linux-gnu`. Same shape as the `strings |
          # grep -q` that made `fetch-testdata.sh ovmf-debug` call every image a
          # RELEASE build.
          host=$(rustc -vV | sed -n 's/^host: //p')
          if [ "$host" != aarch64-unknown-linux-gnu ]; then
            echo "::error title=aarch64::rustc reports host $host, not native aarch64-unknown-linux-gnu"
            exit 1
          fi
          # Two litmus threads have to run at the same instant or the
          # store-buffer test degenerates into two sequential programs, which
          # can never produce the outcome. The referee is blocked at the
          # barrier while they run, so two cores is the real floor.
          [ "$(nproc)" -ge 2 ] || {
            echo "::error title=aarch64::$(nproc) core(s); two litmus threads cannot overlap"
            exit 1
          }
          echo "native aarch64 with $(nproc) cores"
      # First, not last: this is the job's reason to exist, and a suite failure
      # for an unrelated reason must not be what stops the memory model from
      # being asked about.
      #
      # `--release` because `ROUNDS` is 200 000 there and 20 000 otherwise —
      # and the machine rows are 20 000 litmus rounds rather than 2 000 — and
      # the whole file takes about twenty seconds once built.
      # `--test-threads=1` because three of these tests run three threads
      # apiece, and the machine rows put two guest processors on two workers
      # each; a second test competing for the same cores moves every count in
      # the file — the same reason `tests/memory_model_costs.rs` gives.
      #
      # RSEMU_WEAK_MEMORY_REQUIRED turns three printed counts into assertions:
      # the bare-relaxed control must reorder something, the relaxed `fetch_or`
      # that is a barrier on x86-64 and not here must too, and every
      # machine-level row must have lost some of its plain increments. Without
      # them a runner that quietly became x86-64 would report a held gate that
      # nothing was holding — the argument `RSEMU_CROSSHOST_REQUIRED` makes in
      # the job above. Both are searches, so both retry (`ATTEMPTS` in the test
      # file) before failing; that is the deliberate answer to "a litmus row
      # would be flaky in CI", and it is a gate rather than an advisory step
      # because a job that cannot detect anything must not report green. A red
      # here says "this runner did not reorder anything", not "the emulator is
      # broken", and the printed counts are what tells the two apart.
      - name: memory-model litmus, required
        env:
          RSEMU_WEAK_MEMORY_REQUIRED: 1
        run: |
          set -uo pipefail
          rc=0
          cargo test --release --all-features --test memory_model_litmus \
            -- --nocapture --test-threads=1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=weak memory::the litmus failed on aarch64 - read the printed counts above before assuming a regression"
          fi
          exit "$rc"
      # The known-defect searches, which are `#[ignore]`d and therefore invisible
      # to the step above. Both look for a torn load — `RamStore` is a
      # `Vec<AtomicU8>` accessed by a byte loop, so a guest spinning on a word
      # another processor is storing can observe a value that was never in
      # memory — through a whole machine, which is the level
      # `tests/smp_single_copy_atomicity.rs` does not reach.
      #
      # A gate rather than an advisory step, and narrowly: they pass whether or
      # not they find a tear, and fail only when the run did not complete or
      # when the pair they recorded was an *ordering* violation rather than a
      # tear. On this runner that second case would be a defect in `Op::Fence`
      # or `Op::Dmb` reached through a real board, which is precisely the thing
      # no x86-64 job can look for.
      - name: torn-load searches, through a machine
        run: |
          set -uo pipefail
          rc=0
          cargo test --release --all-features --test memory_model_litmus \
            -- --ignored --nocapture --test-threads=1 a_torn_flag || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error title=weak memory::a machine-level torn-load search failed - read the recorded flag/payload pair above"
          fi
          exit "$rc"
      # The rest of the value of an arm64 runner, and it is not small: a
      # genuinely different code generator, a different `usize`-sized world's
      # worth of alignment and atomics lowering, and the Linux host seam on a
      # target where `accel/` and `host/signal.rs` compile themselves out.
      - run: cargo build --all-features
      - run: cargo test --all-features
      # The default build is what users get; it must stand on its own here too.
      - run: cargo test

  wasm-threads-browser:
    name: wasm threads, browser (nightly, advisory)
    runs-on: ubuntu-latest
    # The only nightly job in this workflow, and the only one allowed to break
    # on a toolchain bump. Threaded wasm32-unknown-unknown cannot be built on
    # stable: the precompiled std lacks +atomics, so rust-lld rejects
    # --shared-memory.
    # Rebuilding std needs -Z build-std, which is nightly-only. No shipping
    # artifact comes from here — wasm32-wasip1-threads above is the stable
    # threaded target CI actually gates on. See ROADMAP.md §11.1.
    continue-on-error: true
    env:
      # rust-toolchain.toml pins `stable`, and that file beats whatever the
      # toolchain action installs — so without this the "nightly" job runs
      # stable cargo and -Z is rejected. RUSTUP_TOOLCHAIN overrides the file.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: build with shared memory
        env:
          # Replaces the workflow-wide `-D warnings` on purpose: `+atomics` is
          # an unstable target feature and warns, which would otherwise fail
          # the build for saying exactly what we asked it to do.
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
        run: |
          cargo rustc -Z build-std=std,panic_abort \
            --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features wasm --release
      - name: assert the memory is actually shared
        # Without this the job can pass while producing an ordinary
        # single-threaded module — which would make it prove nothing at all.
        run: |
          python3 - <<'PY'
          import sys
          d = open('target/wasm32-unknown-unknown/release/rsemu.wasm','rb').read()
          def uleb(d, i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          i, shared = 8, None
          while i < len(d):
              sid = d[i]; i += 1
              size, i = uleb(d, i); end = i + size
              if sid == 5:
                  _, j = uleb(d, i)
                  shared = bool(d[j] & 0x02)
              i = end
          print('shared memory:', shared)
          if not shared:
              sys.exit('memory section is not shared - threads would not work')
          PY
