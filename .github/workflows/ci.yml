name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Broken intra-doc links and undocumented public items are invisible to
      # clippy, so they need their own gate — missing_docs is only a warning
      # until something turns warnings into errors.
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features
      - run: cargo test --all-features
      # The default build is what users get; it must stand on its own.
      - run: cargo test
      # The frame-time benchmark is a measurement, never a gate: a shared
      # runner's timings are noise, and a perf threshold checked here would be
      # a flake generator. What *is* checked is that the harness still runs and
      # that its guests still reach the state hashes tests/goldens records —
      # a benchmark whose guest quietly stopped working looks like a speedup.
      # `--smoke` makes that a couple of seconds. One OS is enough; the numbers
      # are not the artefact.
      - name: frame-time benchmark harness
        if: matrix.os == 'ubuntu-latest'
        run: cargo bench --all-features --bench frame_time -- --smoke

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so the rust-version in Cargo.toml is a checked claim rather than
      # a comment that drifts.
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features

  no_std:
    name: no_std core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The emulation core must never depend on std (ROADMAP.md §0). A std leak
      # is a build break, not a style nit, so it is checked every commit.
      - run: cargo build --no-default-features
      - run: cargo test --no-default-features

  features:
    name: feature sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Cargo features are additive-only, so a component that silently needs a
      # sibling feature passes --all-features forever and breaks for the first
      # user who picks a narrow set. Build each feature alone.
      - name: each feature in isolation
        # Enumerated from the manifest rather than listed here: a hand-written
        # list silently stops covering the feature added after it was written,
        # which is exactly the feature most likely to have the bug.
        run: |
          set -euo pipefail
          cargo build --no-default-features
          feats=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            "import json,sys; print(' '.join(sorted(f for f in json.load(sys.stdin)['packages'][0]['features'] if f != 'default')))")
          echo "sweeping: $feats"
          for f in $feats; do
            echo "::group::$f"
            # `cargo test`, not `check`: three bugs shipped past a
            # compile-only sweep in one day. `machine-nes` did not imply
            # `dev-nes-ppu`, and `machine-pc-at` and `machine-gameboy` had
            # media fixtures gated on `std` as well as their own feature --
            # every one of them compiles under every feature set and dies at
            # realize. A sweep that only compiles cannot see that; running the
            # feature's own tests can.
            #
            # This became possible only once narrow-feature runs were
            # deterministic: the `single` backend's locks were racy under
            # libtest's threads, so this job would have been a flake
            # generator. See `core::sync`'s `single` module.
            cargo test --no-default-features --features "$f"
            echo "::endgroup::"
          done

  deps:
    name: dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      # The default build pulls in nothing at all (ROADMAP.md §0). Permitted
      # dependencies are first-party and feature-gated; this asserts the floor.
      - name: default build has no dependencies
        run: |
          set -euo pipefail
          cargo tree --edges normal --prefix none | sort -u > /tmp/tree.txt
          cat /tmp/tree.txt
          if [ "$(wc -l < /tmp/tree.txt)" -ne 1 ]; then
            echo "::error::default build gained a dependency"
            exit 1
          fi

  wasm:
    name: wasm (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip1-threads]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The browser demo is a Vue 3 + Vite application, and check.mjs is gated
      # on the *built* site as well as on the module, so this job needs node.
      # Only wasm32-unknown-unknown builds a page.
      - uses: actions/setup-node@v4
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # wasm rots faster than anything else, so every wasm target is built on
      # every commit from the first one (ROADMAP.md §11).
      - name: build library
        run: cargo build --target ${{ matrix.target }} --no-default-features --features wasm
      - name: build browser cdylib
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features wasm --release
      - name: check exported ABI
        if: matrix.target == 'wasm32-unknown-unknown'
        # A module that compiles but exports nothing is useless to the web
        # harness, and the failure is silent. Assert the symbols exist.
        run: |
          python3 - <<'PY'
          import sys
          d = open('target/wasm32-unknown-unknown/release/rsemu.wasm','rb').read()
          assert d[:4] == b'\0asm', 'not a wasm module'
          def uleb(d, i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          names, i = set(), 8
          while i < len(d):
              sid = d[i]; i += 1
              size, i = uleb(d, i); end = i + size
              if sid == 7:
                  n, j = uleb(d, i)
                  for _ in range(n):
                      ln, j = uleb(d, j); names.add(d[j:j+ln].decode()); j += ln
                      j += 1; _, j = uleb(d, j)
              i = end
          want = {'memory', 'rsemu_echo', 'rsemu_version_ptr', 'rsemu_version_len'}
          missing = want - names
          print('exports:', sorted(names))
          if missing:
              sys.exit(f'missing exports: {sorted(missing)}')
          PY
      # The demo is the only configuration the browser page actually loads, and
      # `wasm` alone does not exercise it. Built after the ABI check above so
      # that check keeps testing the minimal module, not this one.
      - name: build the demo cdylib
        if: matrix.target == 'wasm32-unknown-unknown'
        run: |
          cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features demo --release
      # `npm ci`, not `npm install`: the lockfile is committed and it is the
      # build's input. The licence gate runs here too, because a copyleft
      # package arriving transitively would end up inside the bundle that
      # ships (CLAUDE.md's provenance rule does not stop at the language
      # boundary).
      - name: install the site's dependencies
        if: matrix.target == 'wasm32-unknown-unknown'
        run: npm ci
        working-directory: web
      - name: check bundled licences
        if: matrix.target == 'wasm32-unknown-unknown'
        run: npm run licenses
        working-directory: web
      - name: build the site
        if: matrix.target == 'wasm32-unknown-unknown'
        # public/ is copied verbatim by Vite, so the wasm reaches dist/ whole:
        # not hashed, not inlined, not transformed.
        run: |
          set -euo pipefail
          cp target/wasm32-unknown-unknown/release/rsemu.wasm web/public/rsemu.wasm
          npm run build --prefix web
      - name: browser harness against the real module and the real site
        if: matrix.target == 'wasm32-unknown-unknown'
        # Instantiates the module and drives it: exports vs. what the glue
        # calls, zero imports, the built bundle still calling every one of them
        # and referencing only relative assets that exist, boot, frames,
        # save/restore hash equality, and the page's own frame loop under a
        # stub canvas. Not a DOM test -- nothing here has a browser -- but it
        # catches every drift that is not one.
        run: node web/check.mjs web/dist/rsemu.wasm --site web/dist
      - uses: actions/upload-artifact@v5
        if: matrix.target == 'wasm32-unknown-unknown'
        with:
          name: rsemu-wasm
          path: target/wasm32-unknown-unknown/release/rsemu.wasm
          if-no-files-found: error

  wasm-threads-browser:
    name: wasm threads, browser (nightly, advisory)
    runs-on: ubuntu-latest
    # The only nightly job in this workflow, and the only one allowed to break
    # on a toolchain bump. Threaded wasm32-unknown-unknown cannot be built on
    # stable: the precompiled std lacks +atomics, so rust-lld rejects
    # --shared-memory.
    # Rebuilding std needs -Z build-std, which is nightly-only. No shipping
    # artifact comes from here — wasm32-wasip1-threads above is the stable
    # threaded target CI actually gates on. See ROADMAP.md §11.1.
    continue-on-error: true
    env:
      # rust-toolchain.toml pins `stable`, and that file beats whatever the
      # toolchain action installs — so without this the "nightly" job runs
      # stable cargo and -Z is rejected. RUSTUP_TOOLCHAIN overrides the file.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: build with shared memory
        env:
          # Replaces the workflow-wide `-D warnings` on purpose: `+atomics` is
          # an unstable target feature and warns, which would otherwise fail
          # the build for saying exactly what we asked it to do.
          RUSTFLAGS: >-
            -C target-feature=+atomics,+bulk-memory,+mutable-globals
            -C link-arg=--shared-memory
            -C link-arg=--max-memory=1073741824
        run: |
          cargo rustc -Z build-std=std,panic_abort \
            --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features wasm --release
      - name: assert the memory is actually shared
        # Without this the job can pass while producing an ordinary
        # single-threaded module — which would make it prove nothing at all.
        run: |
          python3 - <<'PY'
          import sys
          d = open('target/wasm32-unknown-unknown/release/rsemu.wasm','rb').read()
          def uleb(d, i):
              r = s = 0
              while True:
                  b = d[i]; i += 1; r |= (b & 0x7f) << s; s += 7
                  if not b & 0x80: return r, i
          i, shared = 8, None
          while i < len(d):
              sid = d[i]; i += 1
              size, i = uleb(d, i); end = i + size
              if sid == 5:
                  _, j = uleb(d, i)
                  shared = bool(d[j] & 0x02)
              i = end
          print('shared memory:', shared)
          if not shared:
              sys.exit('memory section is not shared - threads would not work')
          PY
