name: Pages

# Publishes the browser demo to https://karpeleslab.github.io/rsemu/ on every
# push to master. The repository's Pages source is already set to "workflow",
# so this is the only thing that deploys it.
#
# The demo is deliberately the NON-threaded build. Threaded wasm needs
# SharedArrayBuffer, which needs COOP/COEP headers, which GitHub Pages cannot
# send — so the target that works here is the one CI already gates on as a
# first-class configuration rather than a fallback (ROADMAP.md §11).
#
# The site is a Vue 3 application built by Vite. Two artifacts meet in _site:
# `npm run build`'s output, and the cdylib cargo produced. The .wasm is copied
# into web/public/ *before* the Vite build so it lands in dist/ untouched —
# public/ is verbatim-copied, never hashed, inlined or transformed.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in flight: a half-replaced site is worse than a
# slightly stale one. Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Written once, read never — see the note in ci.yml.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: build the demo
    runs-on: ubuntu-latest
    # Deploying needs the Pages environment, which a fork does not have.
    if: github.repository == 'KarpelesLab/rsemu'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The lib is rlib-only so native builds stay lean; the cdylib is produced
      # on demand. `demo` is `wasm` plus the machines the page offers.
      - name: build the cdylib
        run: |
          cargo rustc --crate-type cdylib --target wasm32-unknown-unknown \
            --no-default-features --features demo --release

      # `npm ci`, not `npm install`: the committed lockfile is the build's
      # input, and a deploy that silently resolves a different Vue is not the
      # thing that was tested.
      - name: install the site's dependencies
        run: npm ci
        working-directory: web

      # Every bundled package ships inside dist/, so the same provenance rule
      # the crate lives under applies to them (CLAUDE.md). A copyleft
      # dependency arriving transitively would otherwise reach the published
      # site unnoticed.
      - name: check bundled licences
        run: npm run licenses
        working-directory: web

      - name: build the site
        run: |
          set -euo pipefail
          cp target/wasm32-unknown-unknown/release/rsemu.wasm web/public/rsemu.wasm
          npm run build --prefix web

      - name: assemble the site
        # Vite's dist/ is already the whole site — the wasm rode through
        # public/ — so this is a move rather than a hand-picked copy. check.mjs
        # and README.md never enter dist: one is a test harness and the other
        # is developer documentation.
        run: |
          set -euo pipefail
          mv web/dist _site
          ls -lR _site

      - name: check the site before publishing it
        # Against the exact artifact being deployed, not a rebuild: instantiates
        # the module, checks every export the glue calls exists, checks the
        # built bundle still calls them and references only relative assets that
        # exist, boots a machine, runs frames, and asserts save/restore hash
        # equality. A broken page fails here rather than in someone's browser.
        run: node web/check.mjs _site/rsemu.wasm --site _site

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
