name: Fuzz

# Not on push. This is drift detection, not a merge gate: sixty seconds a
# target finds nothing a real campaign would (fuzz/README.md has that command),
# and what it actually catches is a target that stopped compiling against a
# changed API. That is a property of the tree, not of an individual commit, so
# once a day answers it just as well as thirty times a day — and it does not
# spend a nightly toolchain install and a cargo-fuzz build on every push.
#
# Run it by hand from the Actions tab before merging anything that changes a
# fuzzed surface: the `.machine` parser, a disk-image parser, or an MMIO device.
on:
  schedule:
    # 04:17 UTC daily. Off the hour on purpose — GitHub's scheduled runners are
    # busiest exactly on it, and a queued job here delays nothing.
    - cron: '17 4 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Written once, read never — see the note in ci.yml.
  CARGO_INCREMENTAL: 0

concurrency:
  group: fuzz
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz smoke (nightly)
    runs-on: ubuntu-latest
    # Nightly by necessity: cargo-fuzz requires it.
    #
    # No `continue-on-error` here, unlike when this job lived in CI. There it
    # had to be advisory because a nightly regression outside our control must
    # never block a merge; on a schedule it can block nothing, so it is allowed
    # to go red and actually be noticed. If nightly churn makes it noisy rather
    # than informative, make it advisory again — but then it needs a different
    # way to be seen, because a green-when-broken drift detector detects
    # nothing.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: build targets
        run: cargo fuzz build
      - name: smoke each target
        # The committed corpus is passed read-only as a second input so a run
        # never rewrites the curated seeds.
        #
        # `cargo fuzz list`, not a list written here. The hand-written one named
        # five targets and the tree has twenty-nine: the rest were built by the
        # step above and then never run, so the drift this job exists to detect
        # was going undetected for exactly the targets added after somebody last
        # edited this line. Thirty seconds each rather than sixty keeps the job
        # about where it was (five minutes becomes roughly twelve) — neither
        # number finds a bug a real campaign would, and `fuzz/README.md` has
        # that command.
        #
        # **Every failure, not the first**, the way the feature sweep in
        # `ci.yml` reports every broken feature. This loop used to be `set -e`,
        # so it died on the first red target and never reached the ones after
        # it — and `blk_image` is fourth of twenty-nine alphabetically. Three
        # further targets were red behind it for weeks: `vnc_proto`,
        # `virtio_mmio` and `xhci_pci`, one of which was a remotely reachable
        # panic in the RFB server and one a reference cycle leaking a whole
        # address space. A list of what is broken is the entire product of a
        # sweep; stopping at the first entry turns it into a sample of one.
        #
        # `::error::` puts each name in the run's annotations at the top of the
        # page, for the same reason the sweep does: a summary line at the end
        # of a long log gets missed.
        run: |
          set -uo pipefail
          failed=""
          for t in $(cargo fuzz list); do
            echo "::group::$t"
            mkdir -p "/tmp/corpus-$t"
            # Not every target has committed seeds; libFuzzer treats a missing
            # input directory as an error rather than as an empty one.
            seeds=""
            [ -d "fuzz/corpus/$t" ] && seeds="fuzz/corpus/$t"
            cargo fuzz run "$t" "/tmp/corpus-$t" $seeds -- \
              -max_total_time=30 -timeout=10 || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            for t in $failed; do
              echo "::error title=fuzz smoke::$t FAILED"
            done
            echo "FUZZ SMOKE FAILED:$failed"
            exit 1
          fi
          echo "every fuzz target survived its thirty seconds"
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
