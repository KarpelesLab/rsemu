name: Long run

# The interpreter against each translated engine, quantum by quantum: over the
# three synthetic workloads at thirty guest seconds each, and over **two** real
# Linux boots — an AArch64 one on `arm64-virt` and an x86-64 one on `pc64`.
#
# # Why this is not in ci.yml
#
# It needs two kernels that cannot be committed (both GPL-2.0 — running one as
# an emulated guest is ordinary use, shipping it here is redistribution), 48 MiB
# of download between them, and minutes of wall time on each board. None of
# that belongs on a pull request.
#
# # Why it is not merely an opt-in test either
#
# It already was one, in effect: `tests/a64_engines.rs` runs forty quanta and
# the honest gate was "somebody boots a kernel by hand and compares hashes".
# Two engine defects survived that — one first parted from the interpreter at
# 15.04 s of guest time and the other at 23.46 s, where it desynchronised the
# guest permanently (docs/platforms/arm64-virt.md). Both were found by hand,
# once, because somebody happened to look. An opt-in nobody opts into is not a
# gate, so this schedule is where the gate lives.
#
# The synthetic half needs no fixture and would run on a pull request happily
# enough — but it is thirty guest seconds of three boards here rather than the
# fraction of a second `cargo test` pays for, and the x86 leg alone is about
# three minutes of that. It rides with the kernel run because the two answer the
# same question at different budgets.
#
# `docs/testing/long-run.md` is the operating manual, and
# `scripts/check.sh long` is the same thing locally.
on:
  schedule:
    # 05:23 UTC daily, after the fuzz job and off the hour for the reason
    # fuzz.yml gives.
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Guest seconds to compare on arm64-virt (default 120)'
        required: false
        default: '120'
      x86_seconds:
        description: 'Guest seconds to compare on pc64 (default 900)'
        required: false
        default: '900'

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

concurrency:
  group: long-run
  cancel-in-progress: true

jobs:
  long-run:
    name: engine divergence (a64, RISC-V, x86; arm64 and x86-64 Linux)
    runs-on: ubuntu-latest
    # A boot is minutes, two engines is twice that, there are two boots now,
    # the three synthetic legs are several more, and the runner's default would
    # kill it silently part-way. Measured on a 64-core host: 319 s for the
    # arm64 boot at 120 guest seconds, about 960 s for the x86 one at 900, and
    # the synthetic half beside them — so the budget is roughly twice what it
    # takes, which is what a nightly wants.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: long-run
      # The same script every other corpus comes through, and the same ignored
      # directory. Nothing is vendored (CLAUDE.md, Testing).
      - name: fetch the arm64 kernel and ramdisk
        run: ./scripts/fetch-testdata.sh arm64-linux arm64-initramfs
      # The x86-64 half. `initramfs-x86` is what lets the kernel reach
      # userspace rather than panicking for want of a root; the run is still a
      # complete boot without it, so this step does not gate the job.
      - name: fetch the x86-64 kernel and ramdisk
        run: ./scripts/fetch-testdata.sh x86-linux initramfs-x86
      # RSEMU_LONGRUN_REQUIRED turns the stage's "no kernel, skipping" into a
      # failure. On a developer's machine skipping is right; here it would mean
      # a held gate that nothing was holding, which is exactly the shape the
      # crosshost job already had to fix.
      - name: interpreter against jit and jit-host
        env:
          RSEMU_LONGRUN_REQUIRED: 1
          RSEMU_LONGRUN_SECONDS: ${{ github.event.inputs.seconds || '120' }}
          # `pc64`'s own budget: 120 guest seconds of that board is still
          # inside the kernel's decompressor. scripts/check.sh says why.
          RSEMU_X86_LONGRUN_SECONDS: ${{ github.event.inputs.x86_seconds || '900' }}
        run: |
          set -uo pipefail
          rc=0
          ./scripts/check.sh long 2>&1 | tee long-run.log || rc=$?
          # The script's own summary lines, not parsed test output.
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|skip) ' long-run.log | while IFS= read -r line; do
              echo "::error title=long run::$line"
            done
            # The harness prints the first divergent quantum and the fields
            # that parted; that is the whole diagnosis and it should be in the
            # checks list rather than three screens up a log.
            grep -E 'left the interpreter at quantum' long-run.log | while IFS= read -r line; do
              echo "::error title=divergence::$line"
            done
          fi
          exit "$rc"
      - name: keep the log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long-run-log
          path: long-run.log
          if-no-files-found: warn
